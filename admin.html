<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - BM Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #fff5f8; padding: 20px 10px; color: #333; max-width: 650px; margin: auto; }
    .card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 5px 20px rgba(216,27,96,0.08); margin-bottom: 25px; }
    h2, h3 { color: #d81b60; text-align: center; margin-top: 0; font-weight: 800; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 14px; color: #444; }
    input, select { width: 100%; padding: 11px; border: 1px solid #f0b6ca; border-radius: 10px; outline: none; font-size: 14px; }
    input:focus, select:focus { border-color: #d81b60; }
    button.submit-btn { width: 100%; background: #d81b60; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 12px rgba(216,27,96,0.2); }
    button.cancel-btn { background: #888; margin-top: 5px; display: none; }
    .product-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ffe4ed; padding: 12px 0; gap: 10px; }
    .product-info { display: flex; align-items: center; gap: 10px; }
    .product-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #fff0f5; }
    .action-btns { display: flex; gap: 5px; }
    button.delete-btn { background: #e74c3c; color: white; border: none; padding: 8px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }
    button.edit-btn { background: #3498db; color: white; border: none; padding: 8px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }
    #msg { text-align: center; margin-top: 12px; font-weight: 700; }
    .loader { text-align: center; color: #888; font-weight: 700; padding: 20px; }
    .admin-signature { text-align: right; padding: 15px 5px; font-size: 12px; font-weight: 700; color: #d81b60; opacity: 0.85; }
    .file-input-wrap { display: flex; gap: 10px; align-items: center; }
    .file-input-wrap input[type="file"] { display: none; }
    .upload-file-btn { background: #f4e8c1; color: #6b5221; border: none; padding: 11px 15px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px; }
    
    /* شاشة تسجيل الدخول وباسورد الداشبورد */
    #auth-screen { position: fixed; inset: 0; background: #fff5f8; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: #fff; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(216,27,96,0.15); width: 100%; max-width: 400px; text-align: center; }
    .auth-box h2 { color: #d81b60; margin-bottom: 20px; }
    #dashboard-content { display: none; }
  </style>
</head>
<body>

  <!-- شاشة إدخال الباسورد للداشبورد -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>🔒 لوحة التحكم المحمية</h2>
      <p style="font-size: 13px; color: #666; margin-bottom: 15px;">برجاء إدخال كلمة المرور للمتابعة</p>
      <div class="form-group">
        <input type="password" id="auth-password" placeholder="اكتب كلمة المرور هنا..." style="text-align: center; font-size: 16px;">
      </div>
      <button class="submit-btn" onclick="checkPassword()">دخول 🚀</button>
      <div id="auth-msg" style="color: red; font-size: 13px; margin-top: 10px; font-weight: 700;"></div>
    </div>
  </div>

  <!-- محتوى الداشبورد الرئيسي -->
  <div id="dashboard-content">
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="onFormSubmit()"></iframe>

    <div class="card">
      <h2 id="form-title">🎀 إضافة منتج جديد</h2>
      
      <form id="add-form" action="https://script.google.com/macros/s/AKfycbywmIh2tIAU-_eEB-O9epM0F3b8VXMvxvl-_h0gTRu1GX0jXyxR5FM3Fzk28i618mY7Pw/exec" method="POST" target="hidden_iframe">
        <input type="hidden" name="action" id="form-action" value="add">
        <input type="hidden" name="id" id="product-id" value="">
        
        <div class="form-group"><label>اسم المنتج</label><input type="text" name="name" id="p-name" required placeholder="مثال: EVA Senses Shower Cream"></div>
        
        <div class="form-group"><label>القسم</label>
          <select name="category" id="p-category">
            <option value="Body Care">Body Care</option>
            <option value="Skin Care">Skin Care</option>
            <option value="Hair Care">Hair Care</option>
            <option value="Kids">Kids</option>
            <option value="Korean">Korean</option>
          </select>
        </div>
        
        <div class="form-group"><label>السعر الحالي (EGP)</label><input type="number" name="new_price" id="p-price" required placeholder="90"></div>
        <div class="form-group"><label>السعر القديم (اختياري)</label><input type="number" name="old_price" id="p-old-price" placeholder="120"></div>
        
        <div class="form-group">
          <label>صورة المنتج (اختر من الجهاز أو ضع الرابط)</label>
          <div class="file-input-wrap">
            <input type="text" name="image_url" id="p-image" required placeholder="رابط الصورة أو ارفع من الجهاز ->">
            <label class="upload-file-btn" for="image-file">اختر صورة 📷</label>
            <input type="file" id="image-file" accept="image/*" onchange="uploadImageToImgBB(this)">
          </div>
        </div>
        
        <button type="submit" class="submit-btn" id="submit-btn-elem" onclick="startLoading()">حفظ ونشر المنتج 🚀</button>
        <button type="button" class="submit-btn cancel-btn" id="cancel-btn-elem" onclick="resetForm()">إلغاء التعديل ✕</button>
      </form>
      
      <div id="msg"></div>
    </div>

    <div class="card">
      <h3>⚙️ إدارة وتعديل المنتجات</h3>
      <div id="admin-list" class="loader">جاري تحميل المنتجات...</div>
    </div>

    <div class="admin-signature">
      Admin bdoor & Admin menna ✨
    </div>
  </div>

<script>
  const CORRECT_PASSWORD = "0105010388as";

  function checkPassword() {
    const inputVal = document.getElementById("auth-password").value.trim();
    const authMsg = document.getElementById("auth-msg");
    if (inputVal === CORRECT_PASSWORD) {
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("dashboard-content").style.display = "block";
      loadAdminProducts();
    } else {
      authMsg.innerText = "كلمة المرور غير صحيحة، حاول مجدداً!";
    }
  }

  document.getElementById("auth-password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") checkPassword();
  });

  const API_URL = "https://script.google.com/macros/s/AKfycbywmIh2tIAU-_eEB-O9epM0F3b8VXMvxvl-_h0gTRu1GX0jXyxR5FM3Fzk28i618mY7Pw/exec";
  let isSubmitting = false;
  let allLoadedProducts = [];

  async function uploadImageToImgBB(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const msg = document.getElementById("msg");
    msg.style.color = "#d81b60";
    msg.innerText = "جاري رفع الصورة للمتجر...";

    const formData = new FormData();
    formData.append("image", file);

    try {
      const res = await fetch("https://api.imgbb.com/1/upload?key=6d207e02196a84f798054c22a36b35d2", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      if (data && data.success) {
        document.getElementById("p-image").value = data.data.url;
        msg.style.color = "green";
        msg.innerText = "تم رفع الصورة بنجاح! 📸";
      } else {
        throw new Error("Upload failed");
      }
    } catch(err) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("p-image").value = e.target.result;
        msg.style.color = "green";
        msg.innerText = "تم تجهيز الصورة بنجاح! 📸";
      };
      reader.readAsDataURL(file);
    }
  }

  function startLoading() {
    const submitBtn = document.getElementById("submit-btn-elem");
    if (submitBtn.disabled) return false;
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.6";
    submitBtn.innerText = "جاري الحفظ والنشر... ⏳";

    const msg = document.getElementById("msg");
    msg.style.color = "#d81b60";
    msg.innerText = "جاري حفظ وتحديث البيانات...";
    isSubmitting = true;
  }

  function onFormSubmit() {
    if (isSubmitting) {
      const actionType = document.getElementById("form-action").value;
      const msg = document.getElementById("msg");
      msg.style.color = "green";
      msg.innerText = actionType === "update" ? "تم تعديل المنتج بنجاح! ✏️" : "تمت إضافة المنتج بنجاح! 🎉";
      
      resetForm();
      setTimeout(loadAdminProducts, 1500);
    }
  }

  function resetForm() {
    document.getElementById("add-form").reset();
    document.getElementById("form-action").value = "add";
    document.getElementById("product-id").value = "";
    document.getElementById("form-title").innerText = "🎀 إضافة منتج جديد";
    
    const submitBtn = document.getElementById("submit-btn-elem");
    submitBtn.disabled = false;
    submitBtn.style.opacity = "1";
    submitBtn.innerText = "حفظ ونشر المنتج 🚀";

    document.getElementById("cancel-btn-elem").style.display = "none";
    document.getElementById("msg").innerText = "";
    isSubmitting = false;
  }

  async function loadAdminProducts() {
    const listDiv = document.getElementById("admin-list");
    try {
      const res = await fetch(API_URL);
      const products = await res.json();
      allLoadedProducts = products;

      if (!products || products.length === 0) {
        listDiv.innerHTML = "<div class='loader'>لا توجد منتجات مضافة عبر الشيت حالياً.</div>";
        return;
      }

      listDiv.innerHTML = "";
      products.slice().reverse().forEach(p => {
        const row = document.createElement("div");
        row.className = "product-row";
        row.innerHTML = `
          <div class="product-info">
            <img src="${p.image_url || 'https://via.placeholder.com/50'}" class="product-thumb" onerror="this.src='https://via.placeholder.com/50'">
            <div>
              <div style="font-weight:700;">${p.name}</div>
              <div style="font-size:12px; color:#888;">${p.new_price} EGP (${p.category || 'عام'})</div>
            </div>
          </div>
          <div class="action-btns">
            <button class="edit-btn" onclick="prepareEdit('${p.id}')">تعديل ✏️</button>
            <button class="delete-btn" onclick="deleteProduct('${p.id}')">حذف 🗑️</button>
          </div>
        `;
        listDiv.appendChild(row);
      });
    } catch(err) {
      listDiv.innerHTML = "<div style='color:red; text-align:center;'>جاري التحديث...</div>";
    }
  }

  function prepareEdit(id) {
    const p = allLoadedProducts.find(item => String(item.id) === String(id));
    if (!p) return;

    document.getElementById("product-id").value = p.id;
    document.getElementById("form-action").value = "update";
    document.getElementById("p-name").value = p.name || "";
    document.getElementById("p-category").value = p.category || "Body Care";
    document.getElementById("p-price").value = p.new_price || "";
    document.getElementById("p-old-price").value = p.old_price || "";
    document.getElementById("p-image").value = p.image_url || "";

    document.getElementById("form-title").innerText = "✏️ تعديل المنتج";
    document.getElementById("submit-btn-elem").innerText = "حفظ التعديلات الحديثة 💾";
    document.getElementById("cancel-btn-elem").style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function deleteProduct(id) {
    if(!confirm("هل أنت تأكد من رغبتك في حذف هذا المنتج؟")) return;
    
    const listDiv = document.getElementById("admin-list");
    listDiv.innerHTML = "<div class='loader'>جاري الحذف...</div>";
    
    const formData = new FormData();
    formData.append("action", "delete");
    formData.append("id", id);
    
    await fetch(API_URL, {
      method: "POST",
      body: formData
    });
    
    setTimeout(loadAdminProducts, 1500);
  }
</script>
</body>
</html>
